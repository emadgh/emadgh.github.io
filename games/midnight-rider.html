<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>جاده بی‌انتها</title>
<style>:root {
  color-scheme: dark;
  font-family: Tahoma, Arial, sans-serif;
  background: #000;
  color: #fff;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
body { overscroll-behavior: none; touch-action: none; }
button { font: inherit; }

.game-shell { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; user-select: none; }
.game-canvas { display: block; width: 100%; height: 100%; outline: none; }

.vignette,
.noise,
.speed-lines,
.flash,
.touch-zones { position: absolute; inset: 0; pointer-events: none; }
.vignette { background: radial-gradient(circle at 50% 55%, transparent 20%, rgba(0,0,0,.18) 54%, rgba(0,0,0,.78) 100%); }
.noise { opacity: .055; mix-blend-mode: screen; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E"); }
.speed-lines { opacity: 0; transition: opacity .25s ease; background: repeating-linear-gradient(90deg, transparent 0 8%, rgba(255,255,255,.035) 8.2% 8.35%, transparent 8.5% 17%); transform: perspective(260px) rotateX(68deg) scale(1.8); transform-origin: center bottom; }
.game-shell.offroad .speed-lines { opacity: .7; }
.flash { background: #ff2f1f; opacity: 0; transition: opacity .4s ease; }
.flash.active { opacity: .55; transition: none; }

.hud { position: absolute; top: calc(12px + var(--safe-top)); left: calc(14px + var(--safe-left)); right: calc(14px + var(--safe-right)); display: flex; direction: ltr; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.hud-card { min-width: 105px; padding: 10px 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: linear-gradient(180deg, rgba(10,12,14,.72), rgba(4,5,6,.42)); backdrop-filter: blur(10px); box-shadow: 0 8px 25px rgba(0,0,0,.28); }
.hud-label { color: rgba(255,255,255,.6); font-size: 11px; letter-spacing: .06em; }
.hud-value { margin-top: 3px; direction: ltr; font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hud-unit { font-size: 11px; opacity: .65; margin-left: 3px; }
.hud-actions { display: flex; gap: 8px; pointer-events: auto; direction: rtl; }
.icon-btn { width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.16); border-radius: 13px; color: #fff; background: rgba(5,7,8,.62); backdrop-filter: blur(9px); cursor: pointer; display: grid; place-items: center; font-size: 17px; }
.icon-btn:active { transform: scale(.96); }

.notice { position: absolute; top: calc(78px + var(--safe-top)); left: 50%; transform: translateX(-50%) translateY(-8px); width: min(92%, 520px); padding: 10px 14px; border-radius: 12px; background: rgba(15,17,18,.84); border: 1px solid rgba(255,255,255,.15); text-align: center; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
.notice.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.touch-zones { display: flex; pointer-events: auto; direction: ltr; }
.touch-zone { width: 50%; height: 100%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: calc(34px + var(--safe-bottom)); color: rgba(255,255,255,0); font-size: 13px; transition: background .1s ease, color .1s ease; }
.touch-zones.guide .touch-zone { color: rgba(255,255,255,.35); }
.touch-zone.active { background: linear-gradient(90deg, rgba(255,255,255,.035), rgba(255,185,55,.09)); color: rgba(255,255,255,.7); }
.touch-zone:first-child.active { background: linear-gradient(-90deg, rgba(255,255,255,.035), rgba(255,185,55,.09)); }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: calc(24px + var(--safe-top)) calc(20px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(20px + var(--safe-left)); z-index: 20; background: rgba(0,0,0,.76); transition: opacity .35s ease, visibility .35s ease; }
.overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.panel { width: min(100%, 520px); padding: 27px; border: 1px solid rgba(255,255,255,.16); border-radius: 26px; background: linear-gradient(180deg, rgba(10,12,13,.75), rgba(2,3,4,.9)); backdrop-filter: blur(18px); box-shadow: 0 30px 80px rgba(0,0,0,.55); text-align: center; }
.eyebrow { color: #ffcb69; font-size: 12px; letter-spacing: .12em; margin-bottom: 8px; }
h1 { margin: 0; font-size: clamp(36px, 8vw, 70px); line-height: 1.05; letter-spacing: -.04em; }
.subtitle { max-width: 410px; margin: 14px auto 22px; color: rgba(255,255,255,.7); line-height: 1.9; font-size: 14px; }
.btn-stack { display: grid; gap: 10px; }
.primary-btn, .secondary-btn { min-height: 54px; border-radius: 16px; cursor: pointer; transition: transform .12s ease, filter .12s ease; }
.primary-btn { border: 0; color: #111; font-weight: 800; background: linear-gradient(135deg, #fff1b6, #ffb740); box-shadow: 0 12px 32px rgba(255,170,42,.22); }
.secondary-btn { color: #fff; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); }
.primary-btn:active, .secondary-btn:active { transform: scale(.985); filter: brightness(.92); }
.tiny { margin-top: 14px; color: rgba(255,255,255,.42); font-size: 11px; line-height: 1.75; }

.game-over h2 { margin: 0 0 8px; font-size: 42px; }
.result { margin: 20px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.result-card { padding: 15px; border-radius: 16px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.1); }
.result-card b { display: block; direction: ltr; font-size: 26px; margin-top: 4px; }
.result-card span { font-size: 11px; color: rgba(255,255,255,.58); }

.rotate-hint { display: none; position: absolute; left: 50%; bottom: calc(18px + var(--safe-bottom)); transform: translateX(-50%); z-index: 7; padding: 7px 11px; border-radius: 999px; background: rgba(0,0,0,.55); color: rgba(255,255,255,.55); font-size: 11px; pointer-events: none; }
@media (orientation: portrait) and (max-width: 720px) { .rotate-hint { display: block; } .panel { padding: 22px; } }
@media (max-width: 460px) { .hud-card { min-width: 92px; padding: 8px 10px; } .hud-value { font-size: 20px; } .icon-btn { width: 41px; height: 41px; } }
</style>
</head>
